<style>
  :root {
    --bg: #f6f4ee;
    --panel: #fbfaf6;

    --ok-bg: #d4e8d8;
    --ok-text: #2f5840;
    --bad-border: rgba(170, 97, 89, 0.5);
    --bad-bg: #efd6d2;
    --bad-text: #874e48;
    --idle-border: rgba(133, 126, 102, 0.2);

    --current-ring: rgba(42, 58, 45, 0.12);

  }

  body {

    background:

    color: var(--text);
    font-family: "Baskerville", "Times New Roman", serif;
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 28px 56px;
  }

  h2 {
    margin: 0;
    font-size: 2rem;
    line-height: 1.1;

    color: var(--muted);
    font-size: 1rem;
    line-height: 1.7;
  }

  .mockup {
    border: 1px solid var(--line);
    border-radius: 24px;
    background: rgba(251, 250, 246, 0.94);
    box-shadow: 0 14px 32px rgba(48, 58, 49, 0.06);

  }

  .mockup-header {

    background: var(--ok-bg);
    color: var(--ok-text);
  }

  .num.bad {
    border-color: var(--bad-border);
    background: var(--bad-bg);
    color: var(--bad-text);
  }

  .num.current {
    box-shadow:
      inset 0 0 0 2px var(--current-ring),
      0 8px 18px var(--current-shadow);
    transform: translateY(-1px);
    font-weight: 700;

  .legend {
    margin-top: 18px;
    color: var(--muted);
    font-size: 0.96rem;
    line-height: 1.75;
